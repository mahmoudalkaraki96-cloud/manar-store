name: Publish reviewed Batch images

on:
  workflow_dispatch:
    inputs:
      item_numbers:
        description: Comma-separated visible product numbers, for example 2035,2038,2041
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Publish selected staged images without another AI call
        env:
          ITEM_NUMBERS: ${{ inputs.item_numbers }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python tools/publish_reviewed_batch_images.py
