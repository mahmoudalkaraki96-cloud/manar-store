name: Count Rokon supplier drafts
on:
  push:
    branches: [ops/rokon-draft-count]
permissions:
  contents: read
jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          sql="""SELECT CASE WHEN lower(ps.source_url) LIKE '%albazar.ps/%' THEN 'Bazar' ELSE 'Tammouni' END supplier, p.active, count(DISTINCT p.id) count FROM product_suppliers ps JOIN products p ON p.id=ps.product_id WHERE p.deleted_at IS NULL AND (lower(ps.source_url) LIKE '%albazar.ps/%' OR lower(ps.source_url) LIKE '%tammouni-home.com/%') GROUP BY 1,2"""
          url="https://api.cloudflare.com/client/v4/accounts/008c61df8c322c27b8d1c1137922e328/d1/database/a5c50923-c7ec-4ede-95b3-d19b93914902/query"
          req=urllib.request.Request(url,data=json.dumps({"sql":sql}).encode(),headers={"Authorization":"Bearer "+os.environ["CLOUDFLARE_API_TOKEN"],"Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=30) as response:
              result=json.load(response)
          assert result["success"] and result["result"][0]["success"]
          print("SUPPLIER_COUNTS",json.dumps(result["result"][0]["results"]))
          PY
