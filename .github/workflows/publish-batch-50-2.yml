name: Publish product image batch 50 part 2

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/publish-batch-50-2.yml

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: manar-store-batch-50-2
          run-id: 35427126313
          github-token: ${{ github.token }}
          path: batch-50-2-results
      - name: Publish 50 images with R2 and D1 verification
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python tools/publish_batch_50_2.py
      - name: Save original link mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manar-store-batch50-2-backup
          path: batch-50-2-publish-record/backup.json
          if-no-files-found: warn
          retention-days: 30
