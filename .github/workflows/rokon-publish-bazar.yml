name: Publish Rokon Bazar drafts
on:
  push:
    branches: [ops/rokon-publish-bazar-drafts]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          url="https://api.cloudflare.com/client/v4/accounts/008c61df8c322c27b8d1c1137922e328/d1/database/a5c50923-c7ec-4ede-95b3-d19b93914902/query"
          def query(sql):
              req=urllib.request.Request(url,data=json.dumps({"sql":sql}).encode(),headers={"Authorization":"Bearer "+os.environ["CLOUDFLARE_API_TOKEN"],"Content-Type":"application/json"})
              with urllib.request.urlopen(req,timeout=35) as response:
                  result=json.load(response)
              assert result["success"] and result["result"][0]["success"]
              return result["result"][0]
          predicate="deleted_at IS NULL AND active=0 AND EXISTS (SELECT 1 FROM product_suppliers ps WHERE ps.product_id=products.id AND (lower(ps.source_url) LIKE 'https://albazar.ps/%' OR lower(ps.source_url) LIKE 'https://www.albazar.ps/%'))"
          print("PUBLISHED",query("UPDATE products SET active=1 WHERE "+predicate)["meta"]["changes"])
          print("REMAINING",query("SELECT count(*) AS remaining FROM products WHERE "+predicate)["results"][0]["remaining"])
          PY
