name: Platform release publisher
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [prepare-release, inspect, setup, upgrade-audit, upgrade-prepare, configure-rokon-owner]
        default: inspect
  pull_request:
    paths: ['platform/control/**', 'platform/runner/**', 'scripts/platform-publish*', 'tests/platform-publish*', '.github/workflows/platform-publisher.yml']
permissions:
  contents: read
concurrency:
  group: platform-release-preparation
  cancel-in-progress: false
jobs:
  publisher:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/platform-console.test.cjs tests/platform-publishing.test.cjs tests/platform-publish-engine.test.mjs tests/platform-unified-schema.test.mjs
      - run: npx tsc --noEmit --strict --target ES2022 --module ESNext --moduleResolution bundler --lib ES2022,DOM --skipLibCheck platform/control/worker.ts
      - name: Build the reviewed shared runtime once
        if: inputs.operation == 'prepare-release'
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(cat VERSION)" = "1.3.0"
          npm run build
      - name: Store private artifacts and certify independent resources
        if: inputs.operation == 'prepare-release'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/platform-publish-prepare.mjs

      - name: Inspect publishing access
        if: inputs.operation == 'inspect'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/platform-publish-setup.mjs inspect
      - name: Configure authorized dedicated release runner
        if: inputs.operation == 'setup'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/platform-publish-setup.mjs setup

      - name: Inspect independent resources before unified upgrade
        if: inputs.operation == 'upgrade-audit'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/platform-unified-upgrade.mjs audit
      - name: Back up and prepare existing stores for the unified runtime
        if: inputs.operation == 'upgrade-prepare'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/platform-unified-upgrade.mjs prepare
      - name: Apply the explicitly approved Rokon administrator
        if: inputs.operation == 'configure-rokon-owner'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/platform-unified-upgrade.mjs configure-rokon-owner
