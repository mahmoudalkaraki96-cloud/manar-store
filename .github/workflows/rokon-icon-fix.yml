name: Deploy Rokon storefront icon fix
on:
  pull_request:
    paths: ['worker/store-icon.ts', 'tests/store-icon.test.cjs', '.github/workflows/rokon-icon-fix.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rokon-storefront-deploy
  cancel-in-progress: false
jobs:
  icon:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: 008c61df8c322c27b8d1c1137922e328
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/store-icon.test.cjs
      - run: npx tsc --noEmit --strict --skipLibCheck --jsx react-jsx --module esnext --moduleResolution bundler --target ES2022 --esModuleInterop --types next worker/store-icon.ts app/components/StoreTheme.tsx app/layout.tsx app/admin/layout.tsx
      - run: npm run build
      - name: Verify existing Rokon resources and preserve schedules
        if: github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/rokon-icon-release.mjs preflight
      - name: Deploy only Rokon storefront without migrations
        if: github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config .rokon-icon.generated.jsonc --keep-vars --tag 1.1.5 --message "Settings-driven browser icon fix"
      - name: Verify live icon and catalog isolation
        if: github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/rokon-icon-release.mjs verify
