name: Import verified missing Dofesh products as drafts
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Preview or import drafts only
        default: preview
        options: [preview, apply]
permissions:
  contents: write
concurrency:
  group: manar-dofesh-missing-draft-import
  cancel-in-progress: false
jobs:
  import-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve concurrent progress
        run: |
          printf '%s\n' 'STORE-PROGRESS.md merge=union' > "$RUNNER_TEMP/draft-progress-attributes"
          git config core.attributesFile "$RUNNER_TEMP/draft-progress-attributes"
          git config user.name 'Manar draft import'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Test draft-only atomic import
        run: python tools/test_dofesh_missing_draft_import.py
      - name: Import only confirmed missing candidates
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          IMPORT_MODE: ${{ inputs.mode }}
        run: python tools/dofesh_missing_draft_import.py --mode "$IMPORT_MODE"
      - name: Save import report and progress
        if: always()
        run: |
          if [ ! -f docs/dofesh-draft-import/latest.json ]; then exit 0; fi
          git add docs/dofesh-draft-import STORE-PROGRESS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: Dofesh draft import results [skip ci]'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
