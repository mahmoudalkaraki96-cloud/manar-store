name: Jabari one-time price update
on:
  push:
    branches: [ops/jabari-weekly-start]
    paths: [".github/workflows/jabari-reprice-once.yml"]
permissions:
  contents: read
concurrency:
  group: manar-jabari-supplier-jobs
  cancel-in-progress: false
jobs:
  update:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify supplier parsing and pricing
        run: PYTHONPATH=tools python tools/test_jabari_supplier_jobs.py
      - name: Apply prices
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python tools/jabari_reprice_once.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jabari-one-time-prices
          path: jabari-reprice-report
