name: Replace product 2215 image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/product-2215-image.yml

permissions:
  contents: read

jobs:
  replace-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEW_KEY: products/ai/product-2215.webp
      OLD_KEY: imports/dofesh-13.jpeg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          ACCOUNT_ID="$(curl -fsS             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts?page=1&per_page=50"             | jq -r '.result[0].id // empty')"
          test -n "$ACCOUNT_ID"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Decode processed image
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/product-image-jobs/product-2215-ai.webp.b64 > /tmp/product-2215-ai.webp
          test -s /tmp/product-2215-ai.webp

      - name: Upload new image
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 r2 object put "manar-store-media/$NEW_KEY"             --file=/tmp/product-2215-ai.webp             --content-type=image/webp             --remote

      - name: Replace product image in D1
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 d1 execute manar-store-db --remote             --command "UPDATE product_media SET url='/media/$NEW_KEY', updated_at=CAST(strftime('%s','now') AS INTEGER)*1000 WHERE product_id=1215 AND url='/media/$OLD_KEY';"
          RESULT="$(npx --yes wrangler@4.92.0 d1 execute manar-store-db --remote --json             --command "SELECT url FROM product_media WHERE product_id=1215 AND is_primary=1 LIMIT 1;")"
          echo "$RESULT" | jq -e --arg url "/media/$NEW_KEY" '.[0].results[0].url == $url'

      - name: Verify new image is served
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 6 --retry-delay 5 --retry-all-errors -fsS             "https://manar-store.mahmoud-alkaraki96.workers.dev/media/$NEW_KEY"             -o /tmp/verified-product-2215.webp
          test -s /tmp/verified-product-2215.webp

      - name: Delete old image after verification
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 r2 object delete "manar-store-media/$OLD_KEY" --remote
