name: Platform console and store provisioning
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Platform operation
        required: true
        default: bootstrap
        type: choice
        options: [bootstrap, prepare]
  pull_request:
    paths: ['platform/control/**', 'scripts/platform-provision.mjs', 'scripts/platform-cloudflare.mjs', 'tests/platform-console.test.cjs', '.github/workflows/platform-console.yml']
permissions:
  contents: read
concurrency:
  group: platform-console-provision
  cancel-in-progress: false
jobs:
  console:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: 008c61df8c322c27b8d1c1137922e328
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/platform-console.test.cjs
      - run: npx tsc --noEmit --strict --target ES2022 --module ESNext --moduleResolution bundler --lib ES2022,DOM --skipLibCheck platform/control/worker.ts
      - name: Bootstrap control database
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'bootstrap'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/platform-provision.mjs bootstrap
      - name: Deploy authenticated control panel
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'bootstrap'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config platform-control.generated.jsonc
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.operation == 'bootstrap'
        with:
          name: platform-control-resources
          path: |
            platform/control/resources.json
            platform-control.generated.jsonc
          if-no-files-found: ignore
      - name: Check pending jobs
        id: plan
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'prepare'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/platform-provision.mjs plan
      - name: Resolve reviewed runtime
        id: runtime
        if: steps.plan.outputs.needed == 'true'
        run: node -e "const fs=require('fs'),r=JSON.parse(fs.readFileSync('platform/runtime-release.json'));if(r.reviewed!==true||!(/^[a-f0-9]{40}$/.test(r.revision)))throw Error('Unreviewed runtime');fs.appendFileSync(process.env.GITHUB_OUTPUT,'revision='+r.revision+'\n')"
      - uses: actions/checkout@v4
        if: steps.plan.outputs.needed == 'true'
        with:
          ref: ${{ steps.runtime.outputs.revision }}
          path: runtime
      - name: Build reviewed generic runtime
        if: steps.plan.outputs.needed == 'true'
        working-directory: runtime
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Prepare queued independent store
        if: steps.plan.outputs.needed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/platform-provision.mjs prepare
