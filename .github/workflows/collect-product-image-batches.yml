name: Collect and publish image Batches

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manar-store-image-batch-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: pip install --disable-pip-version-check 'openai>=2.15.0,<3'
      - name: Collect, publish, and report completed Batches
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python tools/collect_batch_images.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-batch-collector-${{ github.run_id }}
          path: batch-collector-report/
          if-no-files-found: ignore
          retention-days: 30
