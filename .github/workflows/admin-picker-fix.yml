name: Fix admin category picker on iPhone
on:
  workflow_dispatch:
  pull_request:
    paths: ['app/admin/SearchableCategory.tsx', 'tests/category-picker.test.cjs', 'scripts/admin-picker-release.mjs', '.github/workflows/admin-picker-fix.yml']
permissions:
  contents: read
concurrency:
  group: manar-admin-release
  cancel-in-progress: false
jobs:
  picker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/category-picker.test.cjs
      - run: npx tsc --noEmit --strict --skipLibCheck --jsx react-jsx --module esnext --moduleResolution bundler --target ES2022 --esModuleInterop --types next app/admin/SearchableCategory.tsx
      - run: npm run build
      - name: Deploy existing Manar admin only without migrations
        if: github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/admin-picker-release.mjs
