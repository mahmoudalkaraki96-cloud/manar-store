name: Deploy store and admin to Cloudflare
# Manual operator fallback. Routine storefront rollouts are selected in the platform.

on:
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify encrypted web push
        run: node --test tests/web-push.test.cjs

      - name: Verify cart metrics
        run: node --experimental-strip-types --test tests/cart-metrics.test.mjs

      - name: Verify admin dashboard metrics
        run: node --test tests/admin-dashboard.test.cjs

      - name: Verify anonymous browser activity and grouped carts
        run: node --test tests/browser-activity.test.cjs

      - name: Typecheck order editor
        run: npx tsc --noEmit --strict --skipLibCheck --jsx react-jsx --module esnext --moduleResolution bundler --target ES2022 --esModuleInterop --types next worker/admin-security.ts worker/admin-order-lifecycle.ts worker/admin-request.ts worker/customer-admin-auth.ts app/admin/AdminAccess.tsx app/admin/SecurityPanel.tsx app/admin/login/page.tsx app/account/page.tsx app/admin/CustomersPanel.tsx app/admin/page.tsx app/admin/Dashboard.tsx app/admin/MarketingAnalyticsPanel.tsx app/admin/CartMetricsPanel.tsx worker/customer-ledger.ts worker/marketing-analytics.ts worker/admin-dashboard.ts app/admin/ShippingPanel.tsx worker/shipping-zones.ts app/admin/OrdersPanel.tsx worker/order-edit.ts worker/manual-order.ts app/components/StoreHeader.tsx app/product/[id]/page.tsx app/page.tsx app/components/FloatingAction.tsx app/components/PwaRegister.tsx app/components/Notifications.tsx app/components/AdminNotificationButton.tsx app/admin-notification-preferences.ts app/floating-actions.ts app/components/StoreFooter.tsx app/components/StoreTheme.tsx shared/store-theme.ts app/components/StickyCartBar.tsx app/components/CartCustomization.tsx

      - name: Verify order edits and stock rollback
        run: node --test tests/order-preparation.test.cjs tests/order-whatsapp.test.cjs tests/shipping-zones.test.cjs tests/order-edit.test.cjs tests/manual-order.test.cjs

      - name: Verify cart customization
        run: node --test tests/cart-customization.test.cjs tests/store-theme.test.cjs tests/floating-actions.test.cjs

      - name: Verify customer ledger and local-day analytics
        run: node --test tests/admin-security.test.cjs tests/admin-notification-preferences.test.cjs tests/customer-ledger.test.cjs tests/marketing-today.test.cjs

      - name: Build
        run: npm run build

      - name: Resolve Cloudflare account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ACCOUNT_ID="$(curl --fail --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             https://api.cloudflare.com/client/v4/accounts             | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);if(!j.success||!j.result?.[0]?.id)process.exit(1);process.stdout.write(j.result[0].id)})")"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Apply database migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply manar-store-db --remote

      - name: Deploy storefront
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      - name: Deploy admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config wrangler.admin.jsonc


      - name: Verify live push configuration
        run: node tests/push-live-probe.mjs


