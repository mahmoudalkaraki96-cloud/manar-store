name: Dofesh variant audit and sync

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: preview or apply verified supplier options and prices
        default: preview
        options: [preview, apply]
      start:
        description: Highest supplier number to scan (resume skips completed rows)
        default: '1298'
        required: true
      limit:
        description: Maximum products in this run (1-200)
        default: '50'
        required: true
      delay:
        description: Seconds between supplier requests (minimum 5)
        default: '10'
        required: true

permissions:
  contents: write

concurrency:
  group: manar-dofesh-variant-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test parser, atomic saves, idempotency and preservation
        run: python tools/test_dofesh_variant_audit.py
      - name: Audit and synchronize verified Dofesh products
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AUDIT_MODE: ${{ inputs.mode }}
          AUDIT_START: ${{ inputs.start }}
          AUDIT_LIMIT: ${{ inputs.limit }}
          AUDIT_DELAY: ${{ inputs.delay }}
        run: python tools/dofesh_variant_audit.py --mode "$AUDIT_MODE" --start "$AUDIT_START" --limit "$AUDIT_LIMIT" --delay "$AUDIT_DELAY"
      - name: Save reports and progress on GitHub
        if: always()
        run: |
          if [ ! -f docs/dofesh-variant-audit/latest.json ]; then exit 0; fi
          git config user.name 'Manar catalog audit'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/dofesh-variant-audit STORE-PROGRESS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: Dofesh variant audit results [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
