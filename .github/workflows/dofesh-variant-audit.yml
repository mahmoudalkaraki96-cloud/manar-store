name: Dofesh variant audit and sync

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: preview or apply verified supplier options and prices
        default: preview
        options: [preview, apply]
      start:
        description: Highest supplier number to scan (resume skips completed rows)
        default: '1298'
        required: true
      limit:
        description: Maximum products in this run (1-200)
        default: '50'
        required: true
      delay:
        description: Seconds between supplier requests (minimum 5)
        default: '10'
        required: true
      batches:
        description: Number of sequential batches (1-25); stop on block or completion
        default: '1'
        required: true

permissions:
  contents: write

concurrency:
  group: manar-dofesh-variant-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve concurrent progress entries
        shell: bash
        run: |
          printf '%s\n' 'STORE-PROGRESS.md merge=union' > "$RUNNER_TEMP/dofesh-merge-attributes"
          git config core.attributesFile "$RUNNER_TEMP/dofesh-merge-attributes"
      - name: Test parser, atomic saves, idempotency and preservation
        run: python tools/test_dofesh_variant_audit.py
      - name: Audit and synchronize verified Dofesh products
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AUDIT_MODE: ${{ inputs.mode }}
          AUDIT_START: ${{ inputs.start }}
          AUDIT_LIMIT: ${{ inputs.limit }}
          AUDIT_DELAY: ${{ inputs.delay }}
          AUDIT_BATCHES: ${{ inputs.batches }}
        run: |
          python -c 'import os; n=int(os.environ["AUDIT_BATCHES"]); assert 1 <= n <= 25'
          git config user.name 'Manar catalog audit'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for batch in $(seq 1 "$AUDIT_BATCHES"); do
            python tools/dofesh_variant_audit.py --mode "$AUDIT_MODE" --start "$AUDIT_START" --limit "$AUDIT_LIMIT" --delay "$AUDIT_DELAY"
            git add docs/dofesh-variant-audit STORE-PROGRESS.md
            if ! git diff --cached --quiet; then
              git commit -m "docs: Dofesh batch $batch results [skip ci]"
              for attempt in 1 2 3; do
                git pull --rebase origin main
                if git push origin HEAD:main; then break; fi
                if [ "$attempt" = 3 ]; then exit 1; fi
              done
            fi
            state=$(python -c 'import json; print(json.load(open("docs/dofesh-variant-audit/latest.json"))["run_status"])')
            processed=$(python -c 'import json; print(json.load(open("docs/dofesh-variant-audit/latest.json"))["run_processed"])')
            if [ "$state" != completed_batch ] || [ "$processed" = 0 ]; then break; fi
          done
      - name: Save reports and progress on GitHub
        if: always()
        run: |
          if [ ! -f docs/dofesh-variant-audit/latest.json ]; then exit 0; fi
          git config user.name 'Manar catalog audit'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/dofesh-variant-audit STORE-PROGRESS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: Dofesh variant audit results [skip ci]'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
      - name: Preserve report snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dofesh-variant-results
          path: |
            docs/dofesh-variant-audit/
            STORE-PROGRESS.md
          retention-days: 30
