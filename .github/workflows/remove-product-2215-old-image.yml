name: Remove legacy product 2215 image

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remove-product-2215-old-image.yml

permissions:
  contents: read

jobs:
  remove-old-image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve account and delete old R2 object
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?page=1&per_page=50" | jq -r '.result[0].id // empty')"
          test -n "$ACCOUNT_ID"
          export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID"
          npx --yes wrangler@4.92.0 r2 object delete "manar-store-media/imports/dofesh-13.jpeg" --remote
