name: Update existing Red Rose storefront icon
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: red-rose-storefront-deploy
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: 008c61df8c322c27b8d1c1137922e328
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: b772775dd3289c7ff7825668269ce52eaa730aaa
          path: runtime
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - working-directory: runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - working-directory: runtime
        run: node --test tests/store-icon.test.cjs tests/store-profile.test.cjs tests/store-theme.test.cjs tests/admin-security.test.cjs tests/web-push.test.cjs
      - working-directory: runtime
        run: npx tsc --noEmit --strict --skipLibCheck --jsx react-jsx --module esnext --moduleResolution bundler --target ES2022 --esModuleInterop --types next worker/index.ts app/components/StoreTheme.tsx app/layout.tsx app/admin/layout.tsx
      - working-directory: runtime
        run: npm run build
      - name: Verify existing isolated resources without initialization
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/red-rose-icon-release.mjs preflight
      - name: Deploy only the existing storefront
        working-directory: runtime
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config .existing-store-icon.jsonc --keep-vars --tag 1.2.2 --message "Configured favicon hydration fix"
      - name: Verify icon and record the live version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/red-rose-icon-release.mjs verify
