name: Rokon teapot Batch comparison
on: workflow_dispatch
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        model: [gpt-image-2, gpt-image-2.5-flare, gpt-image-2.5-sunburst]
    steps:
      - name: Submit and collect one image edit
        env:
          MODEL: ${{ matrix.model }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          mkdir comparison
          url='https://rokon-store.mahmoud-alkaraki96.workers.dev/media/imports/4b62941fcfe21ba3719e154a7e57164deee974963954074ebfbbd4aac7a86304.webp'
          curl -fsS --max-time 30 "$url" -o comparison/original.webp
          api() { curl -fsS --max-time 90 -H "Authorization: Bearer $OPENAI_API_KEY" "$@"; }
          prompt='Edit the background of this exact stainless steel teapot. Place it on a light stone counter in a quiet warm kitchen with soft natural daylight. Preserve its exact dimensions, metal finish, lid, spout, handle, shape and color. Preserve every physical label, brand mark, letter and number on the item or packaging. Inspect the entire photo, including the corners and background, for the supplier’s digitally overlaid logo or watermark. Remove that overlay completely, including any translucent text or icon, and reconstruct only the area it covered. Preserve all branding and writing physically printed on the teapot or packaging. Add no products or props.'
          jq -cn --arg model "$MODEL" --arg url "$url" --arg prompt "$prompt" '{custom_id:"rokon-teapot",method:"POST",url:"/v1/images/edits",body:{model:$model,images:[{image_url:$url}],prompt:$prompt,quality:"medium",size:"1024x1536"}}' > input.jsonl
          file=$(api https://api.openai.com/v1/files -F purpose=batch -F file=@input.jsonl | jq -er .id)
          jq -cn --arg file "$file" '{input_file_id:$file,endpoint:"/v1/images/edits",completion_window:"24h"}' > request.json
          api https://api.openai.com/v1/batches -H 'Content-Type: application/json' -d @request.json > comparison/batch.json
          id=$(jq -er .id comparison/batch.json)
          echo "Batch: $id"
          while true; do
            api "https://api.openai.com/v1/batches/$id" > comparison/batch.json
            status=$(jq -er .status comparison/batch.json)
            case "$status" in
              completed) break ;;
              failed|expired|cancelled) cat comparison/batch.json; exit 1 ;;
            esac
            sleep 45
          done
          out=$(jq -er .output_file_id comparison/batch.json)
          api "https://api.openai.com/v1/files/$out/content" > output.jsonl
          jq -er '.response.body.data[0].b64_json' output.jsonl | base64 -d > comparison/result.png
          jq -e '.response.body.usage' output.jsonl | tee comparison/usage.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rokon-teapot-${{ matrix.model }}
          path: comparison/
