name: Rokon image model comparison
on: workflow_dispatch
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Edit the same Rokon photo with both models
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          mkdir comparison
          curl -fsS --max-time 30 'https://rokon-store.mahmoud-alkaraki96.workers.dev/media/imports/4b62941fcfe21ba3719e154a7e57164deee974963954074ebfbbd4aac7a86304.webp' -o comparison/original.webp
          prompt='Edit only the scene around this exact stainless-steel teapot. Place it on light travertine in a calm modern kitchen with a warm cream wall and soft daylight. Keep its exact shape, finish, color, size proportions, handle, lid, spout, and original brand marks. Remove only clearly superimposed supplier watermarks. Use natural metal reflections and a realistic contact shadow. Keep the entire product visible and add no props.'
          for model in gpt-image-2 gpt-image-2.6-flare; do
            http=$(curl -sS --max-time 240 -w '%{http_code}' -o response.json https://api.openai.com/v1/images/edits -H "Authorization: Bearer $OPENAI_API_KEY" -F "model=$model" -F "image=@comparison/original.webp;type=image/webp" -F "prompt=$prompt" -F quality=medium -F size=1024x1536)
            if [ "$http" != 200 ]; then jq -c '{error}' response.json > "comparison/$model-error.json"; continue; fi
            jq -er '.data[0].b64_json' response.json | base64 -d > "comparison/$model.png"
            jq '{usage}' response.json > "comparison/$model-usage.json"
            cat "comparison/$model-usage.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rokon-image-comparison
          path: comparison/
