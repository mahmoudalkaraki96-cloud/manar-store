name: Rokon draft screening with item-number exception
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [process, preview, screen, submit, collect]
        default: process
      image_count:
        description: عدد الصور من 1 إلى 300
        type: number
        default: 300
      preview_run:
        type: string
        default: '43572815560'
      submission_run:
        type: string
        description: GitHub run ID for the submitted Rokon batch
permissions:
  contents: read
  actions: read
concurrency:
  group: rokon-draft-logo-screening
  cancel-in-progress: false
jobs:
  screen:
    if: inputs.operation == 'screen'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: rokon-logo-checks.sqlite
          key: rokon-logo-checks-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: rokon-logo-checks-
      - name: Verify Rokon access and screen completed drafts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ROKON_VISION_MODEL: gpt-4.1-mini
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY"
          test -n "$CLOUDFLARE_API_TOKEN"
          printf '%s' '' | base64 -d > rokon_logo_screen.py
          printf '%s' '' | base64 -d > rokon_import.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path("rokon_logo_screen.py")
          s = p.read_text()
          s = s.replace('result = json.load(response)', 'result = json.load(response)\n        print("OPENAI_USAGE", json.dumps(result.get("usage")), flush=True)')
          s = s.replace('except (OSError, ValueError, subprocess.TimeoutExpired):', 'except (OSError, ValueError, subprocess.TimeoutExpired) as error:\n                print("SCREEN_ERROR", product_id, image["id"], type(error).__name__, getattr(error, "code", ""), flush=True)')
          p.write_text(s)
          PY
          python3 - <<'PY' | tee rokon-control.txt
          from pathlib import Path
          from rokon_logo_screen import Screener
          result = Screener(Path("rokon-logo-checks.sqlite")).check("/media/imports/428a3a281657c2fc68840405f676e89aa9eb98156a3ee052269b98f8e3d6f3d5.webp")
          print("KNOWN_LOGO", result, flush=True)
          if result != "watermark":
              raise SystemExit("Known watermark control did not pass")
          PY
          timeout 330m python3 -u rokon_logo_screen.py --publish | tee rokon-logo-report.txt
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: rokon-logo-checks.sqlite
          key: rokon-logo-checks-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rokon-logo-screening-report
          path: |
            rokon-logo-report.txt
            rokon-control.txt

  preview:
    if: inputs.operation == 'preview' || (inputs.operation == 'process' && github.run_attempt == 1)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: rokon-logo-checks.sqlite
          key: rokon-logo-checks-43517042366-1
          fail-on-cache-miss: true
      - run: pip install 'openai>=2.15,<3'
      - name: Select up to 300 previously screened images
        env:
          IMAGE_COUNT: ${{ inputs.image_count }}
          OPERATION: ${{ inputs.operation }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          printf '%s' '' | base64 -d > rokon_logo_screen.py
          printf '%s' '' | base64 -d > rokon_import.py
          cat > rokon_sunburst_batch.py <<'PYTHON_SCRIPT'
          """Rokon draft photo batches. Run preview, submit, then collect using the same report directory."""
          import argparse
          import base64
          import hashlib
          import html
          import json
          import os
          from pathlib import Path
          import sqlite3
          import subprocess
          import tempfile
          import time
          from urllib.request import urlopen
          
          from rokon_import import Cloudflare, BUCKET
          from rokon_logo_screen import ACCOUNT, DATABASE, ORIGIN, RULE
          
          MODEL = "gpt-image-2.5-sunburst"
          ENDPOINT = "/v1/images/edits"
          RISK = ("مصحف", "قرآن", "مطبوع", "كتابة", "تراث", "كوفية", "تعليقة", "شفاف", "اكريلك", "عطر")
          PROMPT = """Edit this product photo for a home goods store. Identify and remove any digitally overlaid supplier logos, watermarks, and item numbers or codes. Preserve all actual branding, labels, text and numbers on the product and packaging. If a mark might be part of the physical product, leave it intact. Replace the background with a clean, realistic setting appropriate for this product, with natural lighting. Preserve shape, color, materials, texture, proportions and the exact number of pieces. Add no accessories that could be mistaken for part of the purchase."""
          DRAFT = """active=0 AND deleted_at IS NULL AND EXISTS (
          SELECT 1 FROM rokon_supplier_imports WHERE product_id=products.id AND state='complete')"""
          
          
          def save(path, data):
              temp = path.with_suffix(".tmp")
              temp.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
              temp.replace(path)
          
          
          def download(url):
              if not url.startswith("/media/imports/"):
                  raise ValueError("Expected a Rokon import image")
              with urlopen(ORIGIN + url, timeout=45) as response:
                  if response.url != ORIGIN + url:
                      raise ValueError("Unexpected media redirect")
                  data = response.read(20_000_001)
                  mime = response.headers.get_content_type()
              if len(data) > 20_000_000 or mime not in {"image/webp", "image/jpeg", "image/png"}:
                  raise ValueError("Unsupported source image")
              return data, mime
          
          
          def preview(db, cache, count):
              rows = []
              with sqlite3.connect(cache.resolve().as_uri() + "?mode=ro", uri=True) as connection:
                  products = connection.execute(
                      "SELECT product_id,image_set FROM product_checks WHERE result='watermark' ORDER BY checked_at DESC,product_id"
                  ).fetchall()
                  seen = set()
                  for product, raw in products:
                      if product in seen:
                          continue
                      seen.add(product)
                      live = db.query(f"""SELECT m.id AS media_id,m.url,m.updated_at,p.id AS product_id,p.item_number,p.name
                          FROM products p JOIN product_media m ON m.product_id=p.id
                          WHERE p.id=? AND p.active=0 AND p.deleted_at IS NULL AND EXISTS (SELECT 1 FROM rokon_supplier_imports i WHERE i.product_id=p.id AND i.state='complete') AND m.variant_id IS NULL AND m.is_primary=1 AND m.media_type='image'
                          AND m.url LIKE '/media/imports/%'""", [product])
                      if len(live) != 1:
                          continue
                      row = live[0]
                      if [row["media_id"], row["url"], row["updated_at"]] not in json.loads(raw):
                          continue
                      data, _ = download(row["url"])
                      digest = hashlib.sha256(data).hexdigest()
                      verdict = connection.execute("SELECT result FROM image_checks WHERE fingerprint=?",
                                                   (f"{RULE}:gpt-4.1-mini:{digest}",)).fetchone()
                      if verdict == ("watermark",) or (verdict is not None and os.getenv("OPERATION") == "process"):
                          rows.append({**row, "sha256": digest})
                          if len(rows) == count:
                              break
              return rows
          
          
          def submit(client, directory, rows):
              if not rows or len(rows) > 300:
                  raise ValueError("Preview must contain 1 to 300 images")
              payloads = []
              for row in rows:
                  data, mime = download(row["url"])
                  if hashlib.sha256(data).hexdigest() != row["sha256"]:
                      raise ValueError(f"Original changed for media {row['media_id']}")
                  payloads.append({"custom_id": f"media-{row['media_id']}", "method": "POST", "url": ENDPOINT,
                                   "body": {"model": MODEL, "images": [{"image_url": f"data:{mime};base64," + base64.b64encode(data).decode()}],
                                            "prompt": PROMPT, "size": "1024x1536", "quality": "medium", "output_format": "webp"}})
              data = ("\n".join(map(json.dumps, payloads)) + "\n").encode()
              if len(data) >= 200_000_000:
                  raise ValueError("Batch file exceeds 200 MB. Use a smaller preview count.")
              uploaded = client.files.create(file=("rokon.jsonl", data), purpose="batch")
              state = directory / "submission.json"
              save(state, {"input_file_id": uploaded.id, "status": "submitting"})
              batch = client.batches.create(input_file_id=uploaded.id, endpoint=ENDPOINT, completion_window="24h")
              save(state, {"input_file_id": uploaded.id, "batch_id": batch.id, "status": batch.status})
              print(f"{len(rows)} images submitted: {batch.id}")
          
          
          def upload(path, key):
              command = "npx.cmd" if os.name == "nt" else "npx"
              subprocess.run([command, "--no-install", "wrangler", "r2", "object", "put", f"{BUCKET}/{key}",
                              "--remote", "--file", str(path.resolve()), "--content-type", "image/webp"],
                             env={**os.environ, "CLOUDFLARE_ACCOUNT_ID": ACCOUNT}, check=True, timeout=120)
          
          
          def collect(client, db, directory, rows, submission):
              batch = client.batches.retrieve(submission["batch_id"])
              print(batch.id, batch.status)
              if batch.status not in {"completed", "failed", "expired", "cancelled"}:
                  return
              result = {}
              for file_id in (batch.output_file_id, batch.error_file_id):
                  if file_id:
                      for line in client.files.content(file_id).text.splitlines():
                          record = json.loads(line)
                          result[record["custom_id"]] = record
              report = []
              for row in rows:
                  item = {**row, "status": "failed"}
                  report.append(item)
                  record = result.get(f"media-{row['media_id']}", {})
                  response = record.get("response") or {}
                  body = response.get("body") or {}
                  item["usage"] = body.get("usage")
                  try:
                      if response.get("status_code") != 200:
                          raise ValueError(str(record.get("error") or body or "No successful image output")[:600])
                      data = base64.b64decode(body["data"][0]["b64_json"], validate=True)
                      from PIL import Image
                      import io
                      with Image.open(io.BytesIO(data)) as picture:
                          if picture.format != "WEBP":
                              raise ValueError("Unexpected output format")
                          picture.load()
                          picture.thumbnail((384, 384))
                          thumbnail = directory / f"{row['media_id']}-thumb.webp"
                          picture.save(thumbnail, "WEBP", quality=78)
                      path = directory / f"{row['media_id']}.webp"
                      path.write_bytes(data)
                      item["file"] = path.name
                      risk = next((word for word in RISK if word in row["name"]), None)
                      if risk:
                          item.update(status="pending_review", reason=f"Review rule matched {risk}")
                          continue
                      # Only auto-publish a single-photo draft. Other photos retain their existing review status.
                      media = db.query("SELECT id,url FROM product_media WHERE product_id=? AND media_type='image'",
                                       [row["product_id"]])
                      key = f"edited/rokon/{batch.id}/{row['media_id']}.webp"
                      target = "/media/" + key
                      if media == [{"id": row["media_id"], "url": target}] and db.query(
                          "SELECT id FROM products WHERE id=? AND active=1 AND deleted_at IS NULL", [row["product_id"]]
                      ):
                          item["status"] = "published"
                          continue
                      if media != [{"id": row["media_id"], "url": row["url"]}]:
                          item.update(status="pending_review", reason="Additional or changed product images")
                          continue
                      upload(path, key)
                      upload(thumbnail, "thumbnails/w384/" + key)
                      now = int(time.time() * 1000)
                      db.batch([
                          (f"""UPDATE product_media SET url=?,updated_at=? WHERE id=? AND product_id=? AND url=? AND updated_at=?
                               AND (SELECT COUNT(*) FROM product_media WHERE product_id=? AND media_type='image')=1
                               AND EXISTS(SELECT 1 FROM products WHERE id=? AND {DRAFT})""",
                           [target, now, row["media_id"], row["product_id"], row["url"], row["updated_at"],
                            row["product_id"], row["product_id"]]),
                          (f"""UPDATE products SET active=1,updated_at=? WHERE id=? AND {DRAFT}
                               AND (SELECT COUNT(*) FROM product_media WHERE product_id=? AND media_type='image')=1
                               AND EXISTS(SELECT 1 FROM product_media WHERE product_id=? AND id=? AND url=?)""",
                           [now, row["product_id"], row["product_id"], row["product_id"], row["media_id"], target]),
                      ])
                      verified = db.query("""SELECT p.id FROM products p JOIN product_media m ON m.product_id=p.id
                                           WHERE p.id=? AND p.active=1 AND m.id=? AND m.url=?""",
                                          [row["product_id"], row["media_id"], target])
                      item.update(status="published" if verified else "pending_review",
                                  reason="" if verified else "Draft or image changed before publication")
                  except Exception as error:
                      item["reason"] = str(error)[:600]
                  finally:
                      write_report(directory, batch.id, report)
          
          
          def write_report(directory, batch_id, rows):
              from collections import Counter
              counts = Counter(row["status"] for row in rows)
              total = sum((row.get("usage") or {}).get("total_tokens", 0) for row in rows)
              cost = 0
              for row in rows:
                  usage = row.get("usage") or {}
                  inputs = usage.get("input_tokens_details") or {}
                  cost += (inputs.get("image_tokens", 0)*4 + inputs.get("text_tokens", 0)*2.5 + usage.get("output_tokens", 0)*15)/1_000_000
              save(directory / "report.json", {"batch_id": batch_id, "counts": counts, "total_tokens": total,
                                               "estimated_usd": round(cost, 6), "items": rows})
              sections = []
              for row in rows:
                  old = html.escape(ORIGIN + row["url"], quote=True)
                  new = html.escape(row.get("file", ""), quote=True)
                  edited = f'<img loading="lazy" src="{new}" alt="بعد">' if new else ""
                  sections.append(f'<section><h2>{row["item_number"]} · {html.escape(row["name"])}</h2>'
                                  f'<p>{row["status"]} · {html.escape(row.get("reason", ""))}</p>'
                                  f'<img loading="lazy" src="{old}" alt="قبل">{edited}</section>')
              (directory / "report.html").write_text(
                  '<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><title>باتش ركن هوم</title>'
                  '<style>body{font:16px system-ui;margin:2em}img{width:46%;height:280px;object-fit:contain}section{border-top:1px solid #ccc}</style>'
                  f'<h1>باتش ركن هوم</h1><p>نُشر {counts["published"]} · للمراجعة {counts["pending_review"]} · '
                  f'فشل {counts["failed"]} · {total} توكن · ${cost:.4f}</p>' + "".join(sections),
                  encoding="utf-8")
          
          
          def main():
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument("mode", choices=("preview", "submit", "collect"))
              parser.add_argument("--directory", required=True, type=Path)
              parser.add_argument("--cache", type=Path)
              parser.add_argument("--count", type=int, choices=range(1, 301), default=300)
              args = parser.parse_args()
              directory = args.directory
              directory.mkdir(parents=True, exist_ok=True)
              plan = directory / "preview.json"
              state = directory / "submission.json"
              db = Cloudflare(ACCOUNT, DATABASE)
              db.verify()
              if args.mode == "preview":
                  if not args.cache or state.exists():
                      parser.error("Preview requires the screening cache and an unused batch directory")
                  rows = preview(db, args.cache, args.count)
                  save(plan, rows)
                  print(f"{len(rows)} eligible images")
                  return
              from openai import OpenAI
              client = OpenAI(max_retries=0, timeout=240)
              rows = json.loads(plan.read_text(encoding="utf-8"))
              if args.mode == "submit":
                  if state.exists():
                      parser.error("Submission already attempted. Check submission.json before taking further action.")
                  submit(client, directory, rows)
              else:
                  collect(client, db, directory, rows, json.loads(state.read_text(encoding="utf-8")))
          
          
          if __name__ == "__main__":
              main()
          PYTHON_SCRIPT
          python rokon_sunburst_batch.py preview --cache rokon-logo-checks.sqlite --directory result --count "$IMAGE_COUNT"
          if [ "$OPERATION" = process ]; then python rokon_sunburst_batch.py submit --directory result; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.operation == 'process' && 'rokon-sunburst-submission' || 'rokon-sunburst-preview' }}
          path: result/

  submit:
    if: inputs.operation == 'submit' && github.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rokon-sunburst-preview
          path: result
          run-id: ${{ inputs.preview_run }}
          github-token: ${{ github.token }}
      - run: pip install 'openai>=2.15,<3'
      - name: Submit verified Rokon images
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          printf '%s' '' | base64 -d > rokon_logo_screen.py
          printf '%s' '' | base64 -d > rokon_import.py
          cat > rokon_sunburst_batch.py <<'PYTHON_SCRIPT'
