name: Rokon Sunburst single photo
on: workflow_dispatch
permissions:
  contents: read
concurrency: rokon-sunburst-single-trial
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - run: pip install 'openai>=2.15,<3'
      - name: Submit one edit and collect results
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir result
          curl --fail --silent --show-error --max-time 60 'https://rokon-store.mahmoud-alkaraki96.workers.dev/media/imports/428a3a281657c2fc68840405f676e89aa9eb98156a3ee052269b98f8e3d6f3d5.webp' -o result/original.webp
          python - <<'PY'
          import base64, json, time
          from pathlib import Path
          from openai import OpenAI

          folder = Path("result")
          original = folder / "original.webp"
          assert original.read_bytes()[8:12] == b"WEBP"
          model = "gpt-image-2.5-sunburst"
          endpoint = "/v1/images/edits"
          payload = {"custom_id": "rokon-sunburst-one", "method": "POST", "url": endpoint, "body": {
              "model": model, "images": [{"image_url": "data:image/webp;base64," + base64.b64encode(original.read_bytes()).decode()}],
              "prompt": "Edit this product photo for a home goods store. Identify and remove any digitally overlaid supplier logos, watermarks, and item numbers or codes. Preserve all actual branding, labels, text and numbers on the product and packaging. If a mark might be part of the physical product, leave it intact. Replace the background with a clean, realistic setting appropriate for this product, with natural lighting. Preserve shape, color, materials, texture, proportions and the exact number of pieces. Add no accessories that could be mistaken for part of the purchase.",
              "size": "1024x1536", "quality": "medium", "output_format": "webp"}}
          client = OpenAI(max_retries=0, timeout=120)
          uploaded = client.files.create(file=("sample.jsonl", (json.dumps(payload) + "\n").encode()), purpose="batch")
          batch = client.batches.create(input_file_id=uploaded.id, endpoint=endpoint, completion_window="24h")
          print("Batch ID", batch.id, flush=True)
          report = folder / "report.json"
          for attempt in range(600):
              report.write_text(json.dumps({"batch_id": batch.id, "status": batch.status, "model": model}, indent=2))
              if batch.status in {"completed", "failed", "expired", "cancelled"}:
                  break
              time.sleep(30)
              batch = client.batches.retrieve(batch.id)
          if not (batch.output_file_id or batch.error_file_id):
              raise RuntimeError(str(batch.errors or batch.status))
          item = json.loads(client.files.content(batch.output_file_id or batch.error_file_id).text.strip())
          response = item.get("response") or {}
          body = response.get("body") or {}
          if response.get("status_code") != 200:
              raise RuntimeError(str(item.get("error") or body)[:1000])
          image = base64.b64decode(body["data"][0]["b64_json"])
          assert image[8:12] == b"WEBP"
          (folder / "edited.webp").write_bytes(image)
          report.write_text(json.dumps({"batch_id": batch.id, "status": batch.status, "model": model, "usage": body.get("usage")}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rokon-sunburst-before-after
          path: result/
