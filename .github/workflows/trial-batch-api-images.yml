  collect:
    if: inputs.operation == 'collect'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: rokon-sunburst-submission
          path: result
          run-id: ${{ inputs.submission_run }}
          github-token: ${{ github.token }}
      - run: pip install 'openai>=2.15,<3' Pillow
      - name: Collect Rokon results and publish eligible drafts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          printf '%s' '' | base64 -d > rokon_logo_screen.py
          printf '%s' '' | base64 -d > rokon_import.py
          cat > rokon_sunburst_batch.py <<'PYTHON_SCRIPT'
          """Rokon draft photo batches. Run preview, submit, then collect using the same report directory."""
          import argparse
          import base64
          import hashlib
          import html
          import json
          import os
          from pathlib import Path
          import sqlite3
          import subprocess
          import tempfile
          import time
          from urllib.request import urlopen
          
          from rokon_import import Cloudflare, BUCKET
          from rokon_logo_screen import ACCOUNT, DATABASE, ORIGIN, RULE
          
          MODEL = "gpt-image-2.5-sunburst"
          ENDPOINT = "/v1/images/edits"
          RISK = ("مصحف", "قرآن", "مطبوع", "كتابة", "تراث", "كوفية", "تعليقة", "شفاف", "اكريلك", "عطر")
          PROMPT = """Edit this product photo for a home goods store. Identify and remove any digitally overlaid supplier logos, watermarks, and item numbers or codes. Preserve all actual branding, labels, text and numbers on the product and packaging. If a mark might be part of the physical product, leave it intact. Replace the background with a clean, realistic setting appropriate for this product, with natural lighting. Preserve shape, color, materials, texture, proportions and the exact number of pieces. Add no accessories that could be mistaken for part of the purchase."""
          DRAFT = """active=0 AND deleted_at IS NULL AND EXISTS (
          SELECT 1 FROM rokon_supplier_imports WHERE product_id=products.id AND state='complete')"""
          
          
          def save(path, data):
              temp = path.with_suffix(".tmp")
              temp.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
              temp.replace(path)
          
          
          def download(url):
              if not url.startswith("/media/imports/"):
                  raise ValueError("Expected a Rokon import image")
              with urlopen(ORIGIN + url, timeout=45) as response:
                  if response.url != ORIGIN + url:
                      raise ValueError("Unexpected media redirect")
                  data = response.read(20_000_001)
                  mime = response.headers.get_content_type()
              if len(data) > 20_000_000 or mime not in {"image/webp", "image/jpeg", "image/png"}:
                  raise ValueError("Unsupported source image")
              return data, mime
          
          
          def preview(db, cache, count):
              rows = []
              with sqlite3.connect(cache.resolve().as_uri() + "?mode=ro", uri=True) as connection:
                  products = connection.execute(
                      "SELECT product_id,image_set FROM product_checks WHERE result='watermark' ORDER BY checked_at DESC,product_id"
                  ).fetchall()
                  seen = set()
                  for product, raw in products:
                      if product in seen:
                          continue
                      seen.add(product)
                      live = db.query(f"""SELECT m.id AS media_id,m.url,m.updated_at,p.id AS product_id,p.item_number,p.name
                          FROM products p JOIN product_media m ON m.product_id=p.id
                          WHERE p.id=? AND p.active=0 AND p.deleted_at IS NULL AND EXISTS (SELECT 1 FROM rokon_supplier_imports i WHERE i.product_id=p.id AND i.state='complete') AND m.variant_id IS NULL AND m.is_primary=1 AND m.media_type='image'
                          AND m.url LIKE '/media/imports/%'""", [product])
                      if len(live) != 1:
                          continue
                      row = live[0]
                      if [row["media_id"], row["url"], row["updated_at"]] not in json.loads(raw):
                          continue
                      data, _ = download(row["url"])
                      digest = hashlib.sha256(data).hexdigest()
                      verdict = connection.execute("SELECT result FROM image_checks WHERE fingerprint=?",
                                                   (f"{RULE}:gpt-4.1-mini:{digest}",)).fetchone()
                      if verdict == ("watermark",):
                          rows.append({**row, "sha256": digest})
                          if len(rows) == count:
                              break
              return rows
          
          
          def submit(client, directory, rows):
              if not rows or len(rows) > 300:
                  raise ValueError("Preview must contain 1 to 300 images")
              payloads = []
              for row in rows:
                  data, mime = download(row["url"])
                  if hashlib.sha256(data).hexdigest() != row["sha256"]:
                      raise ValueError(f"Original changed for media {row['media_id']}")
                  payloads.append({"custom_id": f"media-{row['media_id']}", "method": "POST", "url": ENDPOINT,
                                   "body": {"model": MODEL, "images": [{"image_url": f"data:{mime};base64," + base64.b64encode(data).decode()}],
                                            "prompt": PROMPT, "size": "1024x1536", "quality": "medium", "output_format": "webp"}})
              data = ("\n".join(map(json.dumps, payloads)) + "\n").encode()
              if len(data) >= 200_000_000:
                  raise ValueError("Batch file exceeds 200 MB. Use a smaller preview count.")
              uploaded = client.files.create(file=("rokon.jsonl", data), purpose="batch")
              state = directory / "submission.json"
              save(state, {"input_file_id": uploaded.id, "status": "submitting"})
              batch = client.batches.create(input_file_id=uploaded.id, endpoint=ENDPOINT, completion_window="24h")
              save(state, {"input_file_id": uploaded.id, "batch_id": batch.id, "status": batch.status})
              print(f"{len(rows)} images submitted: {batch.id}")
          
          
          def upload(path, key):
              command = "npx.cmd" if os.name == "nt" else "npx"
              subprocess.run([command, "--no-install", "wrangler", "r2", "object", "put", f"{BUCKET}/{key}",
                              "--remote", "--file", str(path.resolve()), "--content-type", "image/webp"],
                             env={**os.environ, "CLOUDFLARE_ACCOUNT_ID": ACCOUNT}, check=True, timeout=120)
          
          
          def collect(client, db, directory, rows, submission):
              batch = client.batches.retrieve(submission["batch_id"])
              print(batch.id, batch.status)
              if batch.status not in {"completed", "failed", "expired", "cancelled"}:
                  return
              result = {}
              for file_id in (batch.output_file_id, batch.error_file_id):
                  if file_id:
                      for line in client.files.content(file_id).text.splitlines():
                          record = json.loads(line)
                          result[record["custom_id"]] = record
              report = []
              for row in rows:
                  item = {**row, "status": "failed"}
                  report.append(item)
                  record = result.get(f"media-{row['media_id']}", {})
                  response = record.get("response") or {}
                  body = response.get("body") or {}
                  item["usage"] = body.get("usage")
                  try:
                      if response.get("status_code") != 200:
                          raise ValueError(str(record.get("error") or body or "No successful image output")[:600])
                      data = base64.b64decode(body["data"][0]["b64_json"], validate=True)
                      from PIL import Image
                      import io
                      with Image.open(io.BytesIO(data)) as picture:
                          if picture.format != "WEBP":
                              raise ValueError("Unexpected output format")
                          picture.load()
                          picture.thumbnail((384, 384))
                          thumbnail = directory / f"{row['media_id']}-thumb.webp"
                          picture.save(thumbnail, "WEBP", quality=78)
                      path = directory / f"{row['media_id']}.webp"
                      path.write_bytes(data)
                      item["file"] = path.name
                      risk = next((word for word in RISK if word in row["name"]), None)
                      if risk:
                          item.update(status="pending_review", reason=f"Review rule matched {risk}")
                          continue
                      # Only auto-publish a single-photo draft. Other photos retain their existing review status.
                      media = db.query("SELECT id,url FROM product_media WHERE product_id=? AND media_type='image'",
                                       [row["product_id"]])
