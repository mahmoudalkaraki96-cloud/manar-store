                          continue
                      upload(path, key)
                      upload(thumbnail, "thumbnails/w384/" + key)
                      now = int(time.time() * 1000)
                      db.batch([
                          (f"""UPDATE product_media SET url=?,updated_at=? WHERE id=? AND product_id=? AND url=? AND updated_at=?
                               AND (SELECT COUNT(*) FROM product_media WHERE product_id=? AND media_type='image')=1
                               AND EXISTS(SELECT 1 FROM products WHERE id=? AND {DRAFT})""",
                           [target, now, row["media_id"], row["product_id"], row["url"], row["updated_at"],
                            row["product_id"], row["product_id"]]),
                          (f"""UPDATE products SET active=1,updated_at=? WHERE id=? AND {DRAFT}
                               AND (SELECT COUNT(*) FROM product_media WHERE product_id=? AND media_type='image')=1
                               AND EXISTS(SELECT 1 FROM product_media WHERE product_id=? AND id=? AND url=?)""",
                           [now, row["product_id"], row["product_id"], row["product_id"], row["media_id"], target]),
                      ])
                      verified = db.query("""SELECT p.id FROM products p JOIN product_media m ON m.product_id=p.id
                                           WHERE p.id=? AND p.active=1 AND m.id=? AND m.url=?""",
                                          [row["product_id"], row["media_id"], target])
                      item.update(status="published" if verified else "pending_review",
                                  reason="" if verified else "Draft or image changed before publication")
                  except Exception as error:
                      item["reason"] = str(error)[:600]
                  finally:
                      write_report(directory, batch.id, report)
          
          
          def write_report(directory, batch_id, rows):
