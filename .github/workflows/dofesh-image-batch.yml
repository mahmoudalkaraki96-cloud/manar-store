name: دوفش باتش امج

on:
  workflow_dispatch:
    inputs:
      image_count:
        description: عدد صور مسودات دوفش غير المعالجة (1-100)
        required: true
        default: '100'
        type: string
      mode:
        description: معاينة القائمة بدون تكلفة أو إرسال الصور للمعالجة
        required: true
        default: preview
        type: choice
        options:
          - preview
          - submit

permissions:
  contents: read

concurrency:
  group: manar-store-image-batch-submit
  cancel-in-progress: false

jobs:
  dofesh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: فحص اختيار مسودات دوفش والمعاينة
        run: python tools/test_dofesh_batch.py
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: pip install --disable-pip-version-check 'openai>=2.15.0,<3' 'Pillow>=11,<13'
      - name: تجهيز ومعالجة صور مسودات دوفش بنفس الستايل السابق
        env:
          IMAGE_COUNT: ${{ inputs.image_count }}
          BATCH_MODE: ${{ inputs.mode }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python tools/dofesh_batch_images.py
      - name: عرض ملخص الدفعة بدون استخدام مساحة Artifacts
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          plan = Path('dofesh-batch-plan.json')
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          if plan.exists():
              data = json.loads(plan.read_text(encoding='utf-8'))
              items = data.get('products', [])
              lines = [
                  '## دوفش باتش امج',
                  f"- الوضع: {data.get('mode', 'unknown')}",
                  f"- عدد الصور المختارة: {data.get('image_count', len(items))}",
                  '- أرقام الأصناف: ' + (', '.join(str(p.get('item_number', '?')) for p in items) or 'لا يوجد'),
              ]
              summary.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          else:
              summary.write_text('## دوفش باتش امج\nلم يتم إنشاء خطة المعالجة؛ راجع سجل الخطوة السابقة.\n', encoding='utf-8')
          PY
