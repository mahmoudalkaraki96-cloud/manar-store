name: Validate storefront build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --experimental-strip-types --test tests/meta-pixel.test.mjs
      - run: npx tsc --noEmit --strict --skipLibCheck --jsx react-jsx --module esnext --moduleResolution bundler --target ES2022 --esModuleInterop --types next app/admin/CustomersPanel.tsx app/admin/page.tsx app/admin/Dashboard.tsx app/admin/MarketingAnalyticsPanel.tsx app/admin/CartMetricsPanel.tsx worker/customer-ledger.ts worker/marketing-analytics.ts worker/admin-dashboard.ts app/admin/ShippingPanel.tsx worker/shipping-zones.ts app/admin/OrdersPanel.tsx app/admin/SearchableCategory.tsx app/admin/product-filters.ts worker/order-edit.ts worker/manual-order.ts app/components/StoreHeader.tsx app/product/[id]/page.tsx app/page.tsx app/components/FloatingAction.tsx app/components/PwaRegister.tsx app/components/Notifications.tsx app/floating-actions.ts app/components/StoreFooter.tsx app/components/StoreTheme.tsx shared/store-theme.ts app/components/StickyCartBar.tsx app/components/CartCustomization.tsx app/components/StoreShell.tsx app/components/CategoryCards.tsx app/search/SearchResultsClient.tsx
      - run: node --test tests/order-whatsapp.test.cjs tests/shipping-zones.test.cjs tests/order-edit.test.cjs tests/manual-order.test.cjs tests/product-screen.test.cjs
      - run: node --test tests/cart-customization.test.cjs tests/store-theme.test.cjs tests/floating-actions.test.cjs
      - run: node --test tests/customer-ledger.test.cjs tests/marketing-today.test.cjs
      - run: npm run build
