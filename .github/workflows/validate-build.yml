name: Validate storefront build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --experimental-strip-types --test tests/meta-pixel.test.mjs
      - run: npx tsc --noEmit --strict --skipLibCheck --jsx react-jsx --module esnext --moduleResolution bundler --target ES2022 --esModuleInterop app/admin/ShippingPanel.tsx worker/shipping-zones.ts app/admin/OrdersPanel.tsx app/admin/SearchableCategory.tsx app/admin/product-filters.ts worker/order-edit.ts worker/manual-order.ts app/components/StoreHeader.tsx app/product/[id]/page.tsx app/page.tsx app/components/StickyCartBar.tsx app/components/CartCustomization.tsx
      - run: node --test tests/order-whatsapp.test.cjs tests/shipping-zones.test.cjs tests/order-edit.test.cjs tests/manual-order.test.cjs tests/product-screen.test.cjs
      - run: node --test tests/cart-customization.test.cjs
      - run: npm run build
