name: Weekly Dofesh stock check and new drafts
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [preview, apply]
        default: preview
      limit:
        description: Maximum source products to check
        default: '10000'
permissions:
  contents: write
concurrency:
  group: manar-dofesh-weekly
  cancel-in-progress: false
jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test stock safety
        run: python tools/test_dofesh_weekly.py
      - name: Check supplier and import new drafts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MODE: ${{ inputs.mode || 'apply' }}
          LIMIT: ${{ inputs.limit || '10000' }}
        run: python tools/dofesh_weekly.py --mode "$MODE" --limit "$LIMIT"
      - name: Preserve report and progress
        if: always()
        run: |
          if [ ! -f docs/dofesh-weekly/latest.json ]; then exit 0; fi
          printf '%s\n' 'STORE-PROGRESS.md merge=union' > "$RUNNER_TEMP/weekly-attributes"
          git config core.attributesFile "$RUNNER_TEMP/weekly-attributes"
          git config user.name 'Manar weekly Dofesh'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/dofesh-weekly STORE-PROGRESS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: weekly Dofesh stock and draft results [skip ci]'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dofesh-weekly-report
          path: docs/dofesh-weekly
