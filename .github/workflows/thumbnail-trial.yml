name: Trial five stored product thumbnails

on:
  push:
    branches: [main]
    paths:
      - tools/create_thumbnail_trial.py
      - .github/workflows/thumbnail-trial.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manar-store-thumbnail-trial
  cancel-in-progress: false

jobs:
  thumbnails:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: pip install --disable-pip-version-check 'Pillow>=11,<13'
      - name: Create and upload five thumbnail samples
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python tools/create_thumbnail_trial.py
      - name: Upload thumbnail report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thumbnail-trial-${{ github.run_id }}
          path: thumbnail-trial-report/
          if-no-files-found: error
          retention-days: 30
