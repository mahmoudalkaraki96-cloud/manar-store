name: Temporary 20-image AI trial

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/image-trial-20.yml

permissions:
  contents: read

jobs:
  image-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out trial branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenAI client
        run: pip install --disable-pip-version-check "openai>=1.108.0"

      - name: Process 20 trial images
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python tools/image_trial_20.py

      - name: Upload trial results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manar-store-image-trial-20
          path: image-trial-results/
          if-no-files-found: warn
          retention-days: 3
